events {}

http {
  # 클라이언트 IP, 원래 프로토콜 등을 뒤쪽 앱에 전달
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # HTTP → HTTPS 리다이렉트
  server {
    listen 80;
    server_name webtoon.quest;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name webtoon.quest;

    ssl_certificate     /etc/letsencrypt/live/webtoon.quest/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webtoon.quest/privkey.pem;

    client_max_body_size 1m;

    # 헬스체크 '한 경로만' 바깥에 공개 (나머지 /actuator/* 는 공개하지 않음)
    location = /actuator/health {
      proxy_pass http://backend:8080/actuator/health;
    }

    # API → backend  (배지 목록은 네이버를 여러 번 순서대로 호출하므로 여유 있게 60초)
    location /api/ {
      proxy_pass http://backend:8080;
      proxy_read_timeout 60s;
    }

    # 나머지 → frontend
    location / {
      proxy_pass http://frontend:3000;
    }
  }
}